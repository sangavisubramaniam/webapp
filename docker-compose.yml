# Jenkins + Nexus + SonarQube in one file.
# Run ./setup.sh (it generates .env with all passwords) instead of calling this directly.
# Requires Docker Compose >= 2.23.1 (uses inline `configs.content` and `dockerfile_inline`).
name: cicd

services:
  # ---------------------------------------------------------------- SonarQube
  sonar-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # lets SonarQube start on Docker Desktop where vm.max_map_count can't be changed
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

  # -------------------------------------------------------------------- Nexus
  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data

  # ------------------------------------------------------------------ Jenkins
  jenkins:
    image: jenkins-cicd:latest
    build:
      context: .
      dockerfile_inline: |
        FROM jenkins/jenkins:lts-jdk17
        USER root
        RUN apt-get update \
         && apt-get install -y --no-install-recommends docker.io maven curl ca-certificates \
         && rm -rf /var/lib/apt/lists/*
        USER jenkins
        RUN jenkins-plugin-cli --plugins \
            configuration-as-code workflow-aggregator git credentials-binding \
            plain-credentials sonar timestamper ws-cleanup pipeline-stage-view
    restart: unless-stopped
    user: root                      # needed to use the host Docker socket (lab setup)
    depends_on:
      - nexus
      - sonarqube
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - m2_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: jenkins_casc
        target: /casc/jenkins.yaml

# Jenkins Configuration-as-Code: users, label, credentials and SonarQube server
# are created automatically. ${VARS} are filled in from .env by Docker Compose.
configs:
  jenkins_casc:
    content: |
      jenkins:
        systemMessage: "CI server - configured by Configuration as Code"
        numExecutors: 2
        labelString: "jenkins-agent"
        securityRealm:
          local:
            allowsSignup: false
            users:
              - id: "${JENKINS_ADMIN_ID:-admin}"
                password: "${JENKINS_ADMIN_PASSWORD:-admin}"
        authorizationStrategy:
          loggedInUsersCanDoAnything:
            allowAnonymousRead: false
      credentials:
        system:
          domainCredentials:
            - credentials:
                - usernamePassword:
                    scope: GLOBAL
                    id: "Git_Sang_Cred"
                    username: "${GIT_USER:-not-set}"
                    password: "${GIT_TOKEN:-not-set}"
                    description: "GitHub user + personal access token"
                - usernamePassword:
                    scope: GLOBAL
                    id: "DockerHub_Creds"
                    username: "${DOCKERHUB_USER:-not-set}"
                    password: "${DOCKERHUB_TOKEN:-not-set}"
                    description: "Docker Hub username + access token (Read & Write)"
                - usernamePassword:
                    scope: GLOBAL
                    id: "Nexus_Creds"
                    username: "${NEXUS_CI_USER:-jenkins-ci}"
                    password: "${NEXUS_CI_PASSWORD:-not-set}"
                    description: "Nexus upload user"
                - string:
                    scope: GLOBAL
                    id: "sonar-token"
                    secret: "${SONAR_TOKEN:-not-set}"
                    description: "SonarQube analysis token"
      unclassified:
        sonarGlobalConfiguration:
          buildWrapperEnabled: true
          installations:
            - name: "SonarQube"
              serverUrl: "http://sonarqube:9000"
              credentialsId: "sonar-token"

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  nexus_data:
  jenkins_home:
  m2_cache:
